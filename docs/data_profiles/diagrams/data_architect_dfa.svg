q_dead.</text><text font-family="Arial" font-size="13" x="400" y="765" fill="#142536">Exact targets appear in the full transition table.</text><text font-family="Arial" font-size="12" x="25" y="808" fill="#142536">Ci denotes the token set shown on the advancing edge. Input is in canonical category order.</text></svg>