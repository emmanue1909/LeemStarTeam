<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640"><rect width="100%" height="100%" fill="white" /><text font-family="Arial" font-size="20" x="25" y="27" fill="#142536">Machine Learning Engineer</text><line stroke-width="1.5" x1="30" y1="70" x2="85" y2="70" stroke="#24384a" /><polygon points="85,70 76,65 76,75" fill="#24384a" /><circle stroke-width="2" cx="110" cy="70" r="25" fill="white" stroke="#24384a" /><text font-family="Arial" font-size="14" x="101" y="75" fill="#142536">q0</text><line stroke-width="1.5" x1="110" y1="95" x2="110" y2="135" stroke="#24384a" /><polygon points="110,135 105,126 115,126" fill="#24384a" /><text font-family="Arial" font-size="14" x="153" y="118" fill="#142536">C1: Programming</text><text font-family="Arial" font-size="12" x="153" y="137" fill="#142536">PYTHON</text><circle stroke-width="2" cx="110" cy="160" r="25" fill="white" stroke="#24384a" /><text font-family="Arial" font-size="14" x="101" y="165" fill="#142536">q1</text><line stroke-width="1.5" x1="110" y1="185" x2="110" y2="225" stroke="#24384a" /><polygon points="110,225 105,216 115,216" fill="#24384a" /><text font-family="Arial" font-size="14" x="153" y="208" fill="#142536">C2: Data processing</text><text font-family="Arial" font-size="12" x="153" y="227" fill="#142536">PANDAS, NUMPY</text><path d="M 90 145 C 30 110, 30 210, 90 175" fill="none" stroke="#24384a" /><polygon points="90,175 80,169 83,180" fill="#24384a" /><text font-family="Arial" font-size="12" x="25" y="165" fill="#142536">C1</text><circle stroke-width="2" cx="110" cy="250" r="25" fill="white" stroke="#24384a" /><text font-family="Arial" font-size="14" x="101" y="255" fill="#142536">q2</text><line stroke-width="1.5" x1="110" y1="275" x2="110" y2="315" stroke="#24384a" /><polygon points="110,315 105,306 115,306" fill="#24384a" /><text font-family="Arial" font-size="14" x="153" y="298" fill="#142536">C3: Machine learning library</text><text font-family="Arial" font-size="12" x="153" y="317" fill="#142536">SCIKIT_LEARN, TENSORFLOW, PYTORCH</text><path d="M 90 235 C 30 200, 30 300, 90 265" fill="none" stroke="#24384a" /><polygon points="90,265 80,259 83,270" fill="#24384a" /><text font-family="Arial" font-size="12" x="25" y="255" fill="#142536">C2</text><circle stroke-width="2" cx="110" cy="340" r="25" fill="white" stroke="#24384a" /><text font-family="Arial" font-size="14" x="101" y="345" fill="#142536">q3</text><line stroke-width="1.5" x1="110" y1="365" x2="110" y2="405" stroke="#24384a" /><polygon points="110,405 105,396 115,396" fill="#24384a" /><text font-family="Arial" font-size="14" x="153" y="388" fill="#142536">C4: SQL technology</text><text font-family="Arial" font-size="12" x="153" y="407" fill="#142536">SQL, POSTGRESQL, MYSQL</text><path d="M 90 325 C 30 290, 30 390, 90 355" fill="none" stroke="#24384a" /><polygon points="90,355 80,349 83,360" fill="#24384a" /><text font-family="Arial" font-size="12" x="25" y="345" fill="#142536">C3</text><circle stroke-width="2" cx="110" cy="430" r="25" fill="white" stroke="#24384a" /><text font-family="Arial" font-size="14" x="101" y="435" fill="#142536">q4</text><line stroke-width="1.5" x1="110" y1="455" x2="110" y2="495" stroke="#24384a" /><polygon points="110,495 105,486 115,486" fill="#24384a" /><text font-family="Arial" font-size="14" x="153" y="478" fill="#142536">C5: Version control</text><text font-family="Arial" font-size="12" x="153" y="497" fill="#142536">GIT</text><path d="M 90 415 C 30 380, 30 480, 90 445" fill="none" stroke="#24384a" /><polygon points="90,445 80,439 83,450" fill="#24384a" /><text font-family="Arial" font-size="12" x="25" y="435" fill="#142536">C4</text><circle stroke-width="2" cx="110" cy="520" r="25" fill="white" stroke="#24384a" /><text font-family="Arial" font-size="14" x="101" y="525" fill="#142536">q5</text><circle cx="110" cy="520" r="20" fill="none" stroke="#24384a" /><path d="M 90 505 C 30 470, 30 570, 90 535" fill="none" stroke="#24384a" /><polygon points="90,535 80,529 83,540" fill="#24384a" /><text font-family="Arial" font-size="12" x="25" y="525" fill="#142536">C5</text><circle cx="350" cy="575" r="30" fill="white" stroke="#24384a" /><text font-family="Arial" font-size="12" x="328" y="580" fill="#142536">q_dead</text><path d="M 330 553 C 270 505, 420 505, 370 553" fill="none" stroke="#24384a" /><polygon points="370,553 371,542 361,546" fill="#24384a" /><text font-family="Arial" font-size="12" x="330" y="517" fill="#142536">Sigma</text><text font-family="Arial" font-size="13" x="400" y="563" fill="#142536">Every other transition goes to q_dead.</text><text font-family="Arial" font-size="13" x="400" y="585" fill="#142536">Exact targets appear in the full transition table.</text><text font-family="Arial" font-size="12" x="25" y="628" fill="#142536">Ci denotes the token set shown on the advancing edge. Input is in canonical category order.</text></svg>